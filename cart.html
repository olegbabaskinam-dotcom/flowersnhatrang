<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина — Доставка цветов в Нячанге</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--pink:#c0687a;--pink-d:#a94f63;--ink:#292524;--muted:#78716c;--line:#e7e5e4;--bg:#faf8f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
  .serif{font-family:ui-serif,Georgia,"Times New Roman",serif}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .in{max-width:640px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header img{height:34px;border-radius:6px}
  header a{color:inherit;text-decoration:none;font-weight:600;font-size:15px}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:24px;margin:6px 0 14px}
  .cur{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .cur button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
  .cur button.on{border-color:var(--pink);background:#fdf2f5;color:var(--pink-d)}
  .item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
  .item img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#fdf4f7}
  .item .nm{font-weight:600;font-size:15px;line-height:1.25}
  .item .pr{color:var(--muted);font-size:13px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:8px;margin-top:8px}
  .qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:16px;cursor:pointer;line-height:1}
  .qty span{min-width:20px;text-align:center;font-weight:700}
  .del{margin-left:auto;background:none;border:none;color:#b91c1c;font-size:13px;cursor:pointer;align-self:flex-start}
  .sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:6px}
  .sum .row{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}
  .sum .total{font-size:20px;font-weight:800}
  .btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--pink);color:#fff;cursor:pointer;text-align:center;text-decoration:none;margin-top:14px}
  .btn:hover{background:var(--pink-d)}
  .btn.ghost{background:#fff;color:var(--pink-d);border:1px solid var(--pink)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .warn{background:#fff4f4;border:1px solid #f3cccc;color:#9b2c2c;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;display:none}
  .cakehint{background:#fdf6ec;border:1px solid #f3e2c7;color:#8a6d3b;border-radius:10px;padding:9px 12px;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><div class="in">
  <a href="index.html"><img src="img/site/logo.webp" alt="Цветы Нячанг"> Цветы Нячанг</a>
</div></header>

<div class="wrap">
  <h1 class="serif">Корзина</h1>
  <div class="cur" id="curBox"></div>
  <div id="list"></div>
  <div id="sumBox"></div>
  <div class="warn" id="cakeWarn">🎂 Торт можно заказать только вместе с букетом, шарами или набором. Добавьте к заказу что-то ещё.</div>
</div>

<script src="cart.js"></script>
<script>
  var CUR = localStorage.getItem("flw_cur") || "VND";
  function money(v){ return window.fmtMoney(v, CUR); }

  function renderCur(){
    var box=document.getElementById("curBox"); box.innerHTML="";
    window.FLW_CFG.order.forEach(function(c){
      var b=document.createElement("button"); b.textContent=window.FLW_CFG.sym[c]+" "+window.FLW_CFG.names[c];
      if(c===CUR) b.className="on";
      b.onclick=function(){ CUR=c; localStorage.setItem("flw_cur",c); render(); };
      box.appendChild(b);
    });
  }

  function render(){
    renderCur();
    var items=Cart.items(), list=document.getElementById("list"), sum=document.getElementById("sumBox");
    if(!items.length){
      list.innerHTML='<div class="empty">Корзина пуста.<br><br><a class="btn ghost" href="catalog-ru.html">Перейти в каталог</a></div>';
      sum.innerHTML=""; document.getElementById("cakeWarn").style.display="none"; return;
    }
    list.innerHTML="";
    items.forEach(function(it){
      var d=document.createElement("div"); d.className="item";
      d.innerHTML=
        '<img src="'+(it.img||"")+'" alt="">'+
        '<div style="flex:1;min-width:0">'+
          '<div class="nm">'+it.name+'</div>'+
          '<div class="pr">'+money(it.price)+' × '+it.qty+' = <b>'+money(it.price*it.qty)+'</b></div>'+
          '<div class="qty"><button data-m="'+it.id+'">−</button><span>'+it.qty+'</span><button data-p="'+it.id+'">+</button>'+
            '<button class="del" data-d="'+it.id+'">Удалить</button></div>'+
        '</div>';
      list.appendChild(d);
    });
    list.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){var it=Cart.items().filter(function(x){return x.id===b.dataset.p;})[0];Cart.setQty(b.dataset.p,it.qty+1);render();};});
    list.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var it=Cart.items().filter(function(x){return x.id===b.dataset.m;})[0];Cart.setQty(b.dataset.m,it.qty-1);render();};});
    list.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){Cart.remove(b.dataset.d);render();};});

    var total=Cart.total();
    var hasCake=items.some(function(x){return /(^|\s)cakes(\s|$)/.test(x.cat);});
    var hasOther=items.some(function(x){return !/(^|\s)cakes(\s|$)/.test(x.cat);});
    var cakeBlocked=hasCake&&!hasOther;
    document.getElementById("cakeWarn").style.display=cakeBlocked?"block":"none";

    sum.innerHTML=
      '<div class="sum">'+
        '<div class="row"><span>Товаров</span><span>'+Cart.count()+' шт.</span></div>'+
        '<div class="row total"><span>Итого</span><span>'+money(total)+'</span></div>'+
        (CUR!=="VND"?'<div class="row" style="color:var(--muted);font-size:13px"><span>В донгах</span><span>'+window.fmtMoney(total,"VND")+'</span></div>':'')+
      '</div>'+
      (cakeBlocked
        ? '<div class="cakehint">Оформление станет доступно, когда в корзине будет букет, шары или набор.</div>'
        : '<a class="btn" href="checkout.html">Оформить заказ</a>')+
      '<a class="btn ghost" href="catalog-ru.html">Добавить ещё товары</a>';
  }

  document.addEventListener("cart:change",render);
  render();
</script>
</body>
</html>
