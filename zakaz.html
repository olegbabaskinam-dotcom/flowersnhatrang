<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заявки — подтверждение</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Заявки">
<meta name="theme-color" content="#c0687a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  :root{--pink:#c0687a;--pink-d:#a94f63;--ink:#292524;--muted:#78716c;--line:#e7e5e4;--bg:#faf8f6;--ok:#1f9d55}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;
    -webkit-font-smoothing:antialiased;padding-bottom:40px}
  header{background:var(--pink);color:#fff;padding:16px;position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between}
  header b{font-size:17px}
  header button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;outline:none}
  input:focus{border-color:var(--pink)}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--pink);color:#fff;cursor:pointer;text-align:center}
  .btn:hover{background:var(--pink-d)}
  .btn:disabled{opacity:.5}
  .btn.sm{padding:10px 14px;font-size:14px;width:auto}
  .btn.green{background:var(--ok)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .muted{color:var(--muted);font-size:13px}
  .oid{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--pink-d)}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:6px}
  .b-wait{background:#fff4e5;color:#b45309}.b-paid{background:#e7f6ec;color:#1f7a44}
  .b-proc{background:#eef;color:#3730a3}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:50}
  .toast.show{opacity:1}
  h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .spin{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <b>🌸 Заявки</b>
  <button id="refreshBtn">🔄 Обновить</button>
</header>

<div class="wrap">

  <!-- Ввод ключа -->
  <section id="gate" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Вход</h2>
      <p class="muted">Введите код доступа (ADMIN_KEY из настроек скрипта).</p>
      <input id="keyInput" type="password" placeholder="Код доступа" style="margin-bottom:12px">
      <button class="btn" id="keySave">Войти</button>
    </div>
  </section>

  <!-- Основной экран -->
  <section id="main" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">Подтвердить вручную</h2>
      <input id="manualQ" placeholder="ID заказа или почта клиента" style="margin-bottom:10px">
      <button class="btn" id="manualBtn">✅ Подтвердить оплату клиенту</button>
    </div>

    <h2>Последние заявки</h2>
    <div id="list"><p class="muted" id="listStatus">Загрузка…</p></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzDz8tCuWtC4oIA3ajYgt_m5Ui9fZPTgVRiXzVjJTNVrSiP4vNvaNzblCpWJSELOqVC/exec";
const KLS="flw_adminkey";
let KEY=localStorage.getItem(KLS)||"";

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
async function api(data){ data.key=KEY; const r=await fetch(API,{method:"POST",body:new URLSearchParams(data)}); return await r.json(); }

function showGate(){document.getElementById('gate').classList.remove('hidden');document.getElementById('main').classList.add('hidden');}
function showMain(){document.getElementById('gate').classList.add('hidden');document.getElementById('main').classList.remove('hidden');}

document.getElementById('keySave').addEventListener('click',()=>{
  KEY=document.getElementById('keyInput').value.trim();
  if(!KEY) return;
  localStorage.setItem(KLS,KEY); showMain(); loadList();
});
document.getElementById('refreshBtn').addEventListener('click',()=>{ if(KEY) loadList(); });

async function loadList(){
  const box=document.getElementById('list');
  box.innerHTML='<p class="muted">Загрузка…</p>';
  let r;
  try{ r=await api({action:"list"}); }catch(_){ box.innerHTML='<p class="muted">Ошибка сети</p>'; return; }
  if(!r.ok){ if(r.error==='auth'){ toast('Неверный код'); localStorage.removeItem(KLS); KEY=''; showGate(); } else box.innerHTML='<p class="muted">Ошибка</p>'; return; }
  if(!r.orders.length){ box.innerHTML='<p class="muted">Заявок пока нет</p>'; return; }
  box.innerHTML="";
  r.orders.forEach(o=>{
    const paid=String(o.pay||'').indexOf('оплач')>=0;
    const confirmed=String(o.proc||'')==='Оплачено';
    const rej=String(o.proc||'')==='Отклонено';
    const card=document.createElement('div'); card.className="card";
    card.innerHTML=
      '<div><span class="oid">'+o.id+'</span> <span class="muted">'+o.ts+'</span>'+
        (paid?'<span class="badge b-paid">💰 оплачено</span>':'<span class="badge b-wait">⏳ ждёт</span>')+
        (confirmed?'<span class="badge b-proc">✅ подтверждён</span>':'')+
        (rej?'<span class="badge" style="background:#fdecec;color:#9b2c2c">✖ отклонён</span>':'')+
      '</div>'+
      '<div style="margin-top:6px">'+ (o.items||'') +' <b>'+(o.amount||'')+'</b></div>'+
      '<div class="muted" style="margin-top:2px">'+(o.contact||'')+'</div>'+
      '<div class="row">'+
        (confirmed?'<span class="muted">Клиенту отправлено подтверждение</span>'
                  :'<button class="btn sm green" data-id="'+o.id+'">✅ Подтвердить оплату</button>')+
      '</div>';
    box.appendChild(card);
  });
  box.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',()=>confirmOrder(b.dataset.id,b)));
}

async function confirmOrder(q,btn){
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Отправляем…';}
  let r;
  try{ r=await api({action:"confirm",orderId:q}); }catch(_){ toast('Ошибка сети'); if(btn)btn.disabled=false; return; }
  if(r.ok){ toast(r.sentTo?('Подтверждено ✓ письмо → '+r.sentTo):'Подтверждено ✓ (почты нет)'); loadList(); }
  else { toast(r.error==='auth'?'Неверный код':(r.error==='not found'?'Заказ не найден':'Не найдено: '+q)); if(btn){btn.disabled=false;btn.innerHTML='✅ Подтвердить оплату';} }
}

document.getElementById('manualBtn').addEventListener('click',()=>{
  const q=document.getElementById('manualQ').value.trim();
  if(!q){toast('Введите ID или почту');return;}
  confirmOrder(q,null);
});

if(KEY){ showMain(); loadList(); } else showGate();
</script>
</body>
</html>
